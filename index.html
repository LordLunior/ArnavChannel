<!DOCTYPE html>
<html>
<head>
    <title>My YouTube Channel</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(to right, #ff0000, #cc0000);
            color: white;
            margin-top: 120px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            color: red;
            font-weight: bold;
        }

        button:hover {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Welcome to My YouTube Channel 🎥</h1>
    <p>Click below to visit my channel</p>

    <button onclick="openYT()">Open YouTube Channel</button>

    <script>
        function openYT() {
            window.open("https://www.youtube.com/@x_Rudra07", "_blank");
        }
    </script>

</body>
</html>
